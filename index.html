<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feirão 2026 - Verificação</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{min-height:100vh;background:#fce4ec;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  .container{background:#fff;border-radius:16px;padding:40px 32px;max-width:480px;width:100%;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.05)}
  .badge{display:inline-block;background:#e8f5e9;color:#2e7d32;padding:8px 20px;border-radius:20px;font-size:14px;font-weight:500;margin-bottom:20px}
  .badge::before{content:"● ";color:#4caf50}
  .avatar{width:110px;height:110px;margin:0 auto 24px;background:#e91e63;border-radius:50%;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative}
  .avatar img{width:100%;height:100%;object-fit:cover}
  h1{font-size:26px;color:#222;margin-bottom:12px;font-weight:700;line-height:1.25}
  .subtitle{color:#555;font-size:15px;margin-bottom:28px}
  .cta-button{width:100%;background:#e91e63;color:#fff;border:none;padding:18px;border-radius:10px;font-size:17px;font-weight:700;cursor:pointer;transition:.2s}
  .cta-button:hover{background:#c2185b}
  .info-text{font-size:13px;color:#666;margin:14px 0 20px}
  .secondary-button{width:100%;background:#fff;color:#e91e63;border:2px solid #e91e63;padding:14px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s}
  .secondary-button:hover{background:#fce4ec}
  .links{margin-top:24px;display:flex;justify-content:center;align-items:center;gap:10px;font-size:13px}
  .links button{background:none;border:none;color:#1565c0;text-decoration:underline;cursor:pointer;font-size:13px}
  .links span{color:#999}
  .footer{margin-top:24px;font-size:13px;color:#555;text-align:center;max-width:600px;padding:0 20px}
</style>
</head>
