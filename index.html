<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações de Privacidade</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Criando um fundo que imita o site da Wepink sem usar a imagem com erro */
        body, html {
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #5b2d82 0%, #8a44bd 50%, #2e1a3d 100%);
        }

        /* Efeito de luz sutil no fundo para parecer um site real */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, transparent 70%);
            z-index: 1;
        }

        .modal-container {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Janela de Cookies ÚNICA e LIMPA */
        .cookie-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            text-align: left;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cookie-card h2 {
            font-size: 22px;
            color: #000;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .cookie-card p {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: 0.3s;
        }

        .btn-accept {
            background-color: #1a1a1a;
            color: #ffffff !important;
        }

        .btn-accept:hover {
            background-color: #000;
            transform: scale(1.02);
        }

        .btn-prefs {
            background-color: #f2f2f2;
            color: #333 !important;
        }

        .recusar-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #bbb;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="modal-container">
        <div class="cookie-card">
            <h2>Definições de Cookies</h2>
            <p>
                Utilizamos cookies para melhorar sua experiência e personalizar anúncios de acordo com seus interesses. Ao continuar, você concorda com nossa política de privacidade.
            </p>
            
            <div class="button-group">
                <a href="https://whey-wpinkslvsuplementos.netlify.app/" class="btn btn-accept">Aceitar e Continuar</a>
                <a href="https://whey-wpinkslvsuplementos.netlify.app/" class="btn btn-prefs">Configurações</a>
            </div>

            <a href="https://whey-wpinkslvsuplementos.netlify.app/" class="recusar-link">Recusar todos</a>
        </div>
    </div>

</body>
</html>
